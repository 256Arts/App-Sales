# Read by the shared `screenshots` runner in Repos/Scripts. Anything not set takes that script's
# defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="App Sales.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.jaydenirwin.appsales"   # used to clear saved Mac window frames
MAC_APP_NAME="App Sales"                   # the process name, for finding its window (Mac only)
PLATFORMS="iphone ipad mac vision watch"

# The app is sandboxed, so the runner's `defaults`-based window-frame reset resolves to the
# container and finds nothing; ScreenshotMode.clearSavedWindowLayout() does it from inside instead.

# The listing leads with hand-made marketing shots — the widgets, the concept — and the run supplies
# the slot after them: "Phone 6.9 4.png", "Pad 13 2.png", "Mac 2.png", "Vision 2.png". The slots
# below hold the hand-made files, which sit in the same folder, and a run leaves them be. The watch
# app runs the same UI test as the phone, off the same watchOS-only `Screenshots Watch` scheme.
IPHONE_MANUAL_SHOTS="1 2 3"
IPAD_MANUAL_SHOTS="1"
MAC_MANUAL_SHOTS="1"
VISION_MANUAL_SHOTS="1"
# The watch listing has no hand-made shots yet, so the run owns every slot.
WATCH_MANUAL_SHOTS=""

# What each shot shows, for the "Screenshots.md" the run writes beside them. Keyed by the UI test's
# capture name without its "NN-" prefix, or by a whole filename for the hand-made slots above.
SHOT_DESCRIPTIONS="
  home        = The app's own Summary over the seeded account: 30-day proceeds and downloads, their
                change on the previous period, and the per-app bar chart
  Phone 6.9 1 = Hand-made: the medium widget twice on an iOS wallpaper — app icons sized by share,
                then the same totals over a per-app bar chart
  Phone 6.9 2 = Hand-made: the two small widgets side by side — totals alone, and totals with the
                leading apps' icons
  Phone 6.9 3 = Hand-made: the large widget alone, its per-app proceeds and downloads chart filling
                the card
  Pad 13 1    = Hand-made: every widget size at once on an iPadOS wallpaper
  Mac 1       = Hand-made: every widget size at once on a macOS wallpaper
  Vision 1    = Hand-made: two widgets floating in a living room, as they sit in the Shared Space
"

# The app's folder on the 256 Arts site. `--upload` refreshes the shots its page shows from
# the ones here, resized to the frame that page draws.
WEBSITE_SLUG="appsales"

# The headline each shot is sold under on the website, written from the sentence in
# SHOT_DESCRIPTIONS that says what it shows. Keyed the same way, so a line follows its shot
# when the listing reorders.
SHOT_PROMOS="
  Phone 6.9 1 = Yesterday's proceeds, without opening anything.
  Phone 6.9 2 = Small enough to sit anywhere.
  Phone 6.9 3 = A month of every app, in one card.
  home        = Proceeds, downloads and their trend, the moment you look.
"

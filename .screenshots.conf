# Read by the shared `screenshots` runner in Repos/Scripts. Anything not set takes that script's
# defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="App Sales.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.jaydenirwin.appsales"   # used to clear saved Mac window frames
MAC_APP_NAME="App Sales"                   # the process name, for finding its window (Mac only)
PLATFORMS="iphone ipad mac vision watch"

# The app is sandboxed, so the runner's `defaults`-based window-frame reset resolves to the
# container and finds nothing; ScreenshotMode.clearSavedWindowLayout() does it from inside instead.

# The listing leads with the widget shots below, and the run supplies the slots after them. The
# slots here are the ones those take; the watch app runs the same UI test as the phone, off the
# same watchOS-only `Screenshots Watch` scheme.
IPHONE_MANUAL_SHOTS="1 2"
IPAD_MANUAL_SHOTS="1 2"
MAC_MANUAL_SHOTS="1 2"
# Hand-made: two widgets floating in a living room.
VISION_MANUAL_SHOTS="1"
# The watch listing has no hand-made shots yet, so the run owns every slot.
WATCH_MANUAL_SHOTS=""

# The widgets on the shared wallpapers, one shot each for sales and AI usage — see the shared
# `widget-screenshots`. The app draws the tiles itself (App Sales/WidgetShots.swift): the widgets on
# the iPhone, the menu bar extra on the Mac.
WIDGET_RENDER="iphone mac"
WIDGET_TILES="Raw Assets/Screenshots/Widgets and Menu Bar"
WIDGET_SHOTS="
  sales        = Every app's sales, at a glance. | Sales Small Simple Light, Sales Small Light, Sales Large Light, Sales Medium Light, Sales Medium Simple Light
  iphone sales = Every app's sales, at a glance. | Sales Small Simple Light, Sales Small Light, Sales Large Light, Sales Medium Light
  ai           = Your AI limits, always in view. | AI Usage Small Light, AI Usage Medium Light, AI Usage Small Dark, AI Usage Medium Dark, AI Usage Circular, AI Usage Rectangular
  iphone ai    = Your AI limits, always in view. | AI Usage Medium Light, AI Usage Small Light, AI Usage Small Dark, AI Usage Medium Dark, AI Usage Circular, AI Usage Rectangular
  mac ai       = Your AI limits, always in view. | AI Usage Medium Light, glass: Menu Bar Extra, AI Usage Small Light, AI Usage Small Dark
"

# What each shot shows, for the "Screenshots.md" the run writes beside them. Keyed by the UI test's
# capture name without its "NN-" prefix, by "widgets-<name>" for a widget shot, or by a whole
# filename for the hand-made slots above.
SHOT_DESCRIPTIONS="
  home          = The app's own Summary over the seeded account: 30-day proceeds and downloads, their
                  change on the previous period, and the per-app bar chart
  apps          = The app list on the iPhone: every app with its price, 30-day downloads and proceeds
  app           = Forest Explorer's own page: downloads by day, proceeds, updates, in-app purchases,
                  and downloads by device
  widgets-sales = The sales widgets on a wallpaper — small, medium and large, app icons sized by share
                  and a per-app bar chart — under the title “Every app’s sales, at a glance.”
  widgets-ai    = The AI usage widgets on a wallpaper, light and dark, with the Lock Screen accessories
                  (and on the Mac the menu bar extra, open), under the title “Your AI limits, always in view.”
  Vision 1      = Hand-made: two widgets floating in a living room, as they sit in the Shared Space
"

# The app's folder on the 256 Arts site. `--upload` refreshes the shots its page shows from
# the ones here, resized to the frame that page draws.
WEBSITE_SLUG="appsales"

# The headline each shot is sold under on the website, written from the sentence in
# SHOT_DESCRIPTIONS that says what it shows. Keyed the same way, so a line follows its shot
# when the listing reorders.
SHOT_PROMOS="
  widgets-sales = Yesterday's proceeds, without opening anything.
  widgets-ai    = Claude and Codex limits, before they run out.
  home          = Proceeds, downloads and their trend, the moment you look.
  apps          = Every app, ranked by what matters to you.
  app           = Each app's downloads, day by day.
"
